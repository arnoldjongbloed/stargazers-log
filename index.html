<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Stargazers log</h1>
    <p>A log of the repositories I've starred.</p>
    
    <div id="weather-box" class="weather-box">
      <h2>Tomorrow's Weather in the Netherlands</h2>
      <div class="weather-input">
        <input 
          type="text" 
          id="town-input" 
          placeholder="Enter a town in the Netherlands"
          aria-label="Town name"
        >
        <button id="weather-btn">Get Weather</button>
      </div>
      <div id="weather-result"></div>
      <p id="weather-error" role="alert"></p>
    </div>

    <div id="flower-box" class="flower-box">
      <h2>Random Flower Picture</h2>
      <div class="flower-frame">
        <img id="flower-image" alt="" hidden>
      </div>
      <button id="flower-btn">Get Random Flower</button>
      <p id="flower-error" role="alert"></p>
      <p id="flower-credit" hidden>
        Photo by <span id="flower-author"></span> ·
        <a id="flower-source">Wikimedia Commons</a> ·
        <a id="flower-license"></a>
      </p>
    </div>
    
    <ul id="starred"></ul>
    <p id="error" role="alert"></p>
    <script src="script.js"></script>
  </body>
</html>
